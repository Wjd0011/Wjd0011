<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-label="WJD0011 — Computer Vision, Cybersecurity, DevOps">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070D"/>
      <stop offset="0.5" stop-color="#080D1A"/>
      <stop offset="1" stop-color="#0A0814"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.38" stop-color="#8FE3FF"/>
      <stop offset="0.72" stop-color="#7DA8FF"/>
      <stop offset="1" stop-color="#B79CFF"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#6366F1" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cardStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.25"/>
      <stop offset="0.5" stop-color="#3B4B6B" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0.22"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#7DD3FC" stroke-opacity="0.085" stroke-width="1"/>
    </pattern>
    <radialGradient id="gridFade" cx="0.38" cy="0.42" r="0.82">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="0.62" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMask"><rect width="1280" height="440" fill="url(#gridFade)"/></mask>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <style>
      .drift-a { animation: driftA 22s ease-in-out infinite; }
      .drift-b { animation: driftB 26s ease-in-out infinite; }
      .pulse { animation: pulse 3.4s ease-in-out infinite; }
      @keyframes driftA { 0%,100% { transform: translate(0,0); } 50% { transform: translate(36px,-18px); } }
      @keyframes driftB { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-28px,22px); } }
      @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: .9; } }
    </style>
  </defs>

  <rect width="1280" height="440" fill="url(#bg)"/>
  <rect width="1280" height="440" fill="url(#grid)" mask="url(#gridMask)"/>

  <g filter="url(#blur)">
    <circle class="drift-a" cx="230" cy="120" r="190" fill="url(#glowCyan)"/>
    <circle class="drift-b" cx="1080" cy="380" r="210" fill="url(#glowViolet)"/>
    <circle class="drift-a" cx="720" cy="40" r="150" fill="url(#glowBlue)"/>
  </g>

  <!-- frame corners -->
  <g stroke="#22D3EE" stroke-opacity="0.22" stroke-width="1.3" fill="none">
    <path d="M30 64V30h34"/><path d="M1216 30h34v34"/>
    <path d="M1250 376v34h-34"/><path d="M64 410H30v-34"/>
  </g>

  <!-- left identity -->
  <text x="72" y="88" font-family="Consolas, 'JetBrains Mono', 'Courier New', monospace" font-size="12" letter-spacing="4.6" fill="#38BDF8" fill-opacity="0.95">// ENGINEERING PROFILE</text>

  <text x="70" y="198" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="92" font-weight="800" letter-spacing="-3" fill="url(#nameGrad)">WJD0011</text>

  <text x="74" y="246" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="500" letter-spacing="0.5" fill="#D3DEEA">Computer Vision · Cybersecurity · DevOps</text>
  <text x="75" y="280" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="17.5" letter-spacing="1.4" fill="#7F8DA3">机器视觉 · 网络安全 · 运维</text>

  <rect x="72" y="314" width="470" height="1" fill="url(#rule)"/>

  <text x="72" y="356" font-family="Consolas, 'JetBrains Mono', 'Courier New', monospace" font-size="12.5" letter-spacing="0.8" fill="#5D6D82">github.com/Wjd0011</text>
  <text x="72" y="382" font-family="Consolas, 'JetBrains Mono', 'Courier New', monospace" font-size="11" letter-spacing="3.4" fill="#3C4A5E">SEE · DEFEND · RUN</text>

  <!-- right status card -->
  <rect x="792" y="78" width="416" height="272" rx="16" fill="#0A1120" fill-opacity="0.62" stroke="url(#cardStroke)"/>
  <circle cx="816" cy="106" r="3.2" fill="#34D399"/>
  <circle cx="816" cy="106" r="7" fill="#34D399" fill-opacity="0.16" class="pulse"/>
  <text x="830" y="110" font-family="Consolas, 'JetBrains Mono', 'Courier New', monospace" font-size="9.5" letter-spacing="3" fill="#6E8298">SYSTEM PROFILE</text>
  <text x="1186" y="110" text-anchor="end" font-family="Consolas, 'JetBrains Mono', 'Courier New', monospace" font-size="9.5" letter-spacing="2" fill="#3E4E64">2026</text>
  <rect x="816" y="124" width="368" height="1" fill="#18223A"/>

  <!-- row 1 -->
  <g transform="translate(816 146)" fill="none" stroke="#67E8F9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 10c0 0 4-6.4 10.5-6.4S23 10 23 10s-4 6.4-10.5 6.4S2 10 2 10Z"/>
    <circle cx="12.5" cy="10" r="3.1"/>
  </g>
  <text x="856" y="150" font-family="Consolas, 'JetBrains Mono', 'Courier New', monospace" font-size="13" letter-spacing="2.6" fill="#E4EDF7">COMPUTER VISION</text>
  <text x="1186" y="150" text-anchor="end" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" fill="#73849B">机器视觉</text>
  <text x="856" y="167" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11" letter-spacing="0.6" fill="#52627A">检测 · 跟踪 · 边缘推理</text>

  <!-- row 2 -->
  <g transform="translate(816 202)" fill="none" stroke="#A78BFA" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12.5 1.6l9 3.6v6.4c0 5.6-3.8 9.2-9 10.6-5.2-1.4-9-5-9-10.6V5.2l9-3.6Z"/>
    <path d="M8.6 12l2.7 2.7 4.9-5.1"/>
  </g>
  <text x="856" y="206" font-family="Consolas, 'JetBrains Mono', 'Courier New', monospace" font-size="13" letter-spacing="2.6" fill="#E4EDF7">CYBERSECURITY</text>
  <text x="1186" y="206" text-anchor="end" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" fill="#73849B">网络安全</text>
  <text x="856" y="223" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11" letter-spacing="0.6" fill="#52627A">攻防 · 加固 · 应急响应</text>

  <!-- row 3 -->
  <g transform="translate(816 258)" fill="none" stroke="#38BDF8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="1.6" y="2.6" width="21.8" height="17.4" rx="2.6"/>
    <path d="M6 8.6l3 2.8-3 2.8"/>
    <path d="M12.4 14.4h4.8"/>
  </g>
  <text x="856" y="262" font-family="Consolas, 'JetBrains Mono', 'Courier New', monospace" font-size="13" letter-spacing="2.6" fill="#E4EDF7">DEVOPS</text>
  <text x="1186" y="262" text-anchor="end" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" fill="#73849B">运维</text>
  <text x="856" y="279" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11" letter-spacing="0.6" fill="#52627A">容器化 · CI/CD · 可观测性</text>

  <!-- footer pill -->
  <g transform="translate(816 300)">
    <rect x="0" y="0" width="182" height="26" rx="13" fill="#0D1526" stroke="#1F2C42"/>
    <circle cx="15" cy="13" r="3" fill="#34D399"/>
    <text x="28" y="17" font-family="Consolas, 'JetBrains Mono', 'Courier New', monospace" font-size="9.5" letter-spacing="2.4" fill="#7C8FA6">OPEN TO BUILD</text>
  </g>
  <text x="1186" y="318" text-anchor="end" font-family="Consolas, 'JetBrains Mono', 'Courier New', monospace" font-size="9" letter-spacing="2.2" fill="#38465A">CN / EN</text>
</svg>
